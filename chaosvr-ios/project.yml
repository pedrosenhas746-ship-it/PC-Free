name: ChaosVR
options:
  bundleIdPrefix: com.chaosvr
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ChaosVR:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CHAOS VR
        CFBundleName: CHAOS VR
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "CHAOS VR uses the camera for mixed reality and spatial tracking."
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaosvr.prototype
        PRODUCT_NAME: CHAOSVR
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
    dependencies:
      - sdk: ARKit.framework
      - sdk: SceneKit.framework
      - sdk: UIKit.framework

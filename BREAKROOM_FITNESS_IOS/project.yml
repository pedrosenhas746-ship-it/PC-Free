name: BreakroomFitness
options:
  bundleIdPrefix: com.breakroom
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BreakroomFitness:
    type: application
    platform: iOS
    sources:
      - path: Sources/AppDelegate.swift
      - path: Sources/GiantRuntime.swift
      - path: Sources/GiantGameViewController.swift
    resources:
      - path: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BREAKROOM Giant MR
        UILaunchScreen: {}
        NSCameraUsageDescription: BREAKROOM Giant MR uses the camera for mixed reality and visible hand tracking.
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breakroom.fitnessmr.giant
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: ARKit.framework
      - sdk: SceneKit.framework
      - sdk: Vision.framework

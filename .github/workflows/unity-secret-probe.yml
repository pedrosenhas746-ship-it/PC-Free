name: Unity Secret Availability Probe

on:
  push:
    paths:
      - '.github/workflows/unity-secret-probe.yml'
      - 'UNITY_PROBE_TRIGGER.txt'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret availability without exposing values
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then echo 'UNITY_LICENSE_PRESENT=yes'; else echo 'UNITY_LICENSE_PRESENT=no'; fi
          if [ -n "$UNITY_SERIAL" ]; then echo 'UNITY_SERIAL_PRESENT=yes'; else echo 'UNITY_SERIAL_PRESENT=no'; fi
          if [ -n "$UNITY_EMAIL" ]; then echo 'UNITY_EMAIL_PRESENT=yes'; else echo 'UNITY_EMAIL_PRESENT=no'; fi
          if [ -n "$UNITY_PASSWORD" ]; then echo 'UNITY_PASSWORD_PRESENT=yes'; else echo 'UNITY_PASSWORD_PRESENT=no'; fi

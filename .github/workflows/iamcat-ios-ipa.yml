name: I Am Cat VR iOS IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'ios/IAmCatVR/**'
      - '.github/workflows/iamcat-ios-ipa.yml'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/IAmCatVR
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: ios/IAmCatVR
        run: |
          set -euo pipefail
          xcodebuild \
            -project IAmCatVR.xcodeproj \
            -scheme IAmCatVR \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        working-directory: ios/IAmCatVR
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/IAmCatVR.app"
          test -d "$APP"
          rm -rf Payload IAmCatVR-v0.2-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry IAmCatVR-v0.2-unsigned.ipa Payload
          shasum -a 256 IAmCatVR-v0.2-unsigned.ipa | tee IAmCatVR-v0.2-unsigned.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IAmCatVR-iOS-IPA
          path: |
            ios/IAmCatVR/IAmCatVR-v0.2-unsigned.ipa
            ios/IAmCatVR/IAmCatVR-v0.2-unsigned.sha256
          if-no-files-found: error

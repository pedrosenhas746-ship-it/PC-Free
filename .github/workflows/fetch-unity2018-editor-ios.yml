name: Fetch Unity 2018.4.36f1 Editor and iOS Support Split

on:
  push:
    branches: [superhotvr-ios-handtracking]
    paths:
      - '.github/workflows/fetch-unity2018-editor-ios.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download official Unity editor and iOS support
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            'https://download.unity3d.com/download_unity/6cd387d23174/LinuxEditorInstaller/Unity-2018.4.36f1.tar.xz' \
            -o /tmp/Unity-2018.4.36f1.tar.xz
          curl -fL --retry 4 --retry-delay 3 \
            'https://download.unity3d.com/download_unity/6cd387d23174/LinuxEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-2018.4.36f1.tar.xz' \
            -o /tmp/UnitySetup-iOS-Support-for-Editor-2018.4.36f1.tar.xz
          sha256sum /tmp/Unity-2018.4.36f1.tar.xz /tmp/UnitySetup-iOS-Support-for-Editor-2018.4.36f1.tar.xz | tee /tmp/SHA256SUMS.txt
          split -b 400M -d -a 2 /tmp/Unity-2018.4.36f1.tar.xz /tmp/editor.part-
          split -b 400M -d -a 2 /tmp/UnitySetup-iOS-Support-for-Editor-2018.4.36f1.tar.xz /tmp/ios.part-
          ls -lh /tmp/editor.part-* /tmp/ios.part-* /tmp/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unity-editor-part-00
          path: /tmp/editor.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: unity-editor-part-01
          path: /tmp/editor.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: unity-editor-part-02
          path: /tmp/editor.part-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: unity-ios-part-00
          path: /tmp/ios.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: unity-ios-part-01
          path: /tmp/ios.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: unity-2018-sha256
          path: /tmp/SHA256SUMS.txt
          retention-days: 1

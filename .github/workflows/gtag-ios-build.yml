name: Build MonkeTag VR IPA
on:
  workflow_dispatch:
  push:
    branches: [gtag-ios-build]
    paths:
      - 'ios/MonkeTagVR/**'
      - '.github/workflows/gtag-ios-build.yml'
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch ufbx FBX runtime
        working-directory: ios/MonkeTagVR
        run: |
          set -euo pipefail
          mkdir -p Sources/UFBX
          curl -fL --retry 4 https://raw.githubusercontent.com/ufbx/ufbx/master/ufbx.h -o Sources/UFBX/ufbx.h
          curl -fL --retry 4 https://raw.githubusercontent.com/ufbx/ufbx/master/ufbx.c -o Sources/UFBX/ufbx.c
      - name: Generate project
        working-directory: ios/MonkeTagVR
        run: xcodegen generate
      - name: Resolve packages
        working-directory: ios/MonkeTagVR
        run: xcodebuild -project MonkeTagVR.xcodeproj -scheme MonkeTagVR -resolvePackageDependencies
      - name: Build unsigned iPhone app
        working-directory: ios/MonkeTagVR
        run: |
          set -euo pipefail
          xcodebuild \
            -project MonkeTagVR.xcodeproj \
            -scheme MonkeTagVR \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log
      - name: Package loader IPA
        working-directory: ios/MonkeTagVR
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/MonkeTagVR.app"
          test -d "$APP"
          rm -rf Payload MonkeTagVR-v0.3-loader-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MonkeTagVR-v0.3-loader-unsigned.ipa Payload
          shasum -a 256 MonkeTagVR-v0.3-loader-unsigned.ipa | tee MonkeTagVR-v0.3-loader-unsigned.sha256
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonkeTagVR-v0.3-Loader-IPA
          path: |
            ios/MonkeTagVR/MonkeTagVR-v0.3-loader-unsigned.ipa
            ios/MonkeTagVR/MonkeTagVR-v0.3-loader-unsigned.sha256
            ios/MonkeTagVR/xcodebuild.log
          if-no-files-found: error

name: CHAOS VR iPhone IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-ipa:
    name: Build CHAOS VR IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          cd chaosvr-ios
          xcodegen generate
          test -f ChaosVR.xcodeproj/project.pbxproj

      - name: Build arm64 iPhone app
        run: |
          set -euxo pipefail
          cd chaosvr-ios
          xcodebuild \
            -project ChaosVR.xcodeproj \
            -scheme ChaosVR \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package real IPA
        run: |
          set -euxo pipefail
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP"
          test -f "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/CHAOSVR.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/CHAOSVR.app/Info.plist | tee bundle-id.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/CHAOSVR.app/Info.plist | tee executable.txt
          test -f "Payload/CHAOSVR.app/$(cat executable.txt)"
          ditto -c -k --sequesterRsrc --keepParent Payload CHAOSVR-iPhone-UNSIGNED.ipa
          shasum -a 256 CHAOSVR-iPhone-UNSIGNED.ipa | tee CHAOSVR-iPhone-UNSIGNED.sha256
          unzip -t CHAOSVR-iPhone-UNSIGNED.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CHAOSVR-iPhone-IPA-${{ github.run_number }}
          path: |
            CHAOSVR-iPhone-UNSIGNED.ipa
            CHAOSVR-iPhone-UNSIGNED.sha256
            bundle-id.txt
            executable.txt
            xcodebuild.log
          if-no-files-found: error
          retention-days: 14

  breakroom-mr:
    name: Build BREAKROOM MR Android EMRD
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout BREAKROOM source
        uses: actions/checkout@v4
        with:
          ref: breakroom-mr

      - name: Download official EnJoyTheMR SDK
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://raw.githubusercontent.com/Zhes-20/etmr-repo/main/ETMR_AppSDK_withXLua_20260814.unitypackage' -o /tmp/etmr-sdk.unitypackage
          test -s /tmp/etmr-sdk.unitypackage
          ls -lh /tmp/etmr-sdk.unitypackage

      - name: Reconstruct SDK in Unity project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile, pathlib, shutil
          src=pathlib.Path('/tmp/etmr-sdk.unitypackage')
          tmp=pathlib.Path('/tmp/etmr_unpack')
          project=pathlib.Path('BREAKROOM_MR')
          if tmp.exists(): shutil.rmtree(tmp)
          tmp.mkdir(parents=True)
          with tarfile.open(src,'r:gz') as tf: tf.extractall(tmp)
          count=0
          for d in tmp.iterdir():
              if not d.is_dir(): continue
              pathname=d/'pathname'
              if not pathname.exists(): continue
              rel=pathname.read_text(encoding='utf-8').strip()
              if not rel: continue
              dst=project/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              asset=d/'asset'; meta=d/'asset.meta'
              if asset.exists(): shutil.copy2(asset,dst)
              if meta.exists(): shutil.copy2(meta,pathlib.Path(str(dst)+'.meta'))
              count+=1
          print('SDK entries reconstructed:',count)
          if count < 10: raise SystemExit('ETMR SDK extraction failed')
          PY

      - name: Validate 6DoF source
        run: |
          set -euo pipefail
          test -f BREAKROOM_MR/Assets/BreakroomMR/Editor/BreakroomBuilder.cs
          test -f BREAKROOM_MR/Assets/BreakroomMR/Editor/ProceduralMeshFactory.cs
          test -f BREAKROOM_MR/Assets/BreakroomMR/Lua/breakroom.lua.txt
          grep -q 'GetHeadRotation' BREAKROOM_MR/Assets/BreakroomMR/Lua/breakroom.lua.txt
          grep -q 'GetHandRotation' BREAKROOM_MR/Assets/BreakroomMR/Lua/breakroom.lua.txt
          grep -q 'for i=0,20' BREAKROOM_MR/Assets/BreakroomMR/Lua/breakroom.lua.txt
          ! grep -q 'typeof(' BREAKROOM_MR/Assets/BreakroomMR/Lua/breakroom.lua.txt
          echo '6DoF source preflight passed'

      - name: Build Android AssetBundle and EMRD
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: BREAKROOM_MR
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: BreakroomMR.Editor.BreakroomBuilder.CI
          allowDirtyBuild: true

      - name: Validate final EMRD
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,json,os
          p='BREAKROOM_MR/Build/BreakroomMR/BREAKROOM_MR_ANDROID.emrd'
          if not os.path.isfile(p): raise SystemExit('EMRD missing')
          with zipfile.ZipFile(p) as z:
              assert 'app.json' in z.namelist() and 'bundle' in z.namelist()
              app=json.loads(z.read('app.json'))
              assert app['type']=='bundle'
              assert app['display']=='scene'
              assert app['entryPrefab']=='BreakroomMRRoot'
              print('bundle bytes:',z.getinfo('bundle').file_size)
              print('emrd bytes:',os.path.getsize(p))
          PY
          ls -lh BREAKROOM_MR/Build/BreakroomMR/BREAKROOM_MR_ANDROID.emrd

      - name: Upload BREAKROOM MR EMRD
        uses: actions/upload-artifact@v4
        with:
          name: BREAKROOM-MR-ANDROID-EMRD-${{ github.run_number }}
          path: BREAKROOM_MR/Build/BreakroomMR/BREAKROOM_MR_ANDROID.emrd
          if-no-files-found: error
          retention-days: 14

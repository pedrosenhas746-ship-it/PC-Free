name: BREAKROOM Giant iOS IPA

on:
  push:
    branches: [breakroom-fitness-giant-v03]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  giant-ios:
    name: Build BREAKROOM Giant MR IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: Generate original BREAKROOM assets
        run: |
          set -euxo pipefail
          cd BREAKROOM_FITNESS_IOS
          python3 generate_assets.py
          find Resources -type f -maxdepth 3 -print
          du -sh Resources
          test -f Resources/Models/longsword.obj
          test -f Resources/Models/enemy_helmet.obj
          test -f Resources/Audio/parry.wav

      - name: Normalize Giant Swift source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('BREAKROOM_FITNESS_IOS/Sources')
          game = src / 'GiantGameViewController.swift'
          runtime = src / 'GiantRuntime.swift'

          s = game.read_text()
          s = s.replace(
              'let d=min(gSegDistance(h,a,b),gSegDistance(t,a,b),gSegDistance(p,a,b))',
              'let d=min(gSegDistance(h,a,b),min(gSegDistance(t,a,b),gSegDistance(p,a,b)))'
          )
          game.write_text(s)

          s = runtime.read_text()
          s = s.replace('enum Archetype:String,CaseIterable {', 'enum Archetype:String,CaseIterable,Equatable {')
          s = s.replace('enum State { case approach,strafe,feint,telegraph,strike,recover,evade,stunned,disarmed,dead }',
                        'enum State: Equatable { case approach,strafe,feint,telegraph,strike,recover,evade,stunned,disarmed,dead }')
          s = s.replace('guard let src=sources[name]?.copy() as? SCNAudioSource else{return}',
                        'guard let src=sources[name] else{return}')
          runtime.write_text(s)

          for p in [runtime, game]:
              s = p.read_text()
              # .58 -> 0.58 and -.58 -> -0.58, without touching .systemRed/.init/etc.
              s = re.sub(r'(?<![A-Za-z0-9_])\.(\d+)', r'0.\1', s)
              # Swift 6 requires consistent whitespace around simple assignment.
              # Exclude ==, !=, <=, >=, +=, -=, *=, /= and similar operators.
              s = re.sub(r'(?<![=!<>+\-*/%&|^?])\s*=\s*(?!=)', ' = ', s)
              p.write_text(s)
          PY

          if xcrun --find swift-format >/dev/null 2>&1; then
            xcrun swift-format format -i BREAKROOM_FITNESS_IOS/Sources/GiantRuntime.swift
            xcrun swift-format format -i BREAKROOM_FITNESS_IOS/Sources/GiantGameViewController.swift
          else
            echo 'swift-format unavailable; continuing after normalization'
          fi

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          cd BREAKROOM_FITNESS_IOS
          xcodegen generate
          test -f BreakroomFitness.xcodeproj/project.pbxproj

      - name: Build arm64 iPhone app
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cd BREAKROOM_FITNESS_IOS
          xcodebuild \
            -project BreakroomFitness.xcodeproj \
            -scheme BreakroomFitness \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedDataGiant" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build 2>&1 | tee "$GITHUB_WORKSPACE/breakroom-giant-xcodebuild.log"

      - name: Print compiler errors
        if: always()
        run: |
          echo '===== SWIFT/XCODE ERRORS ====='
          grep -n -E 'error:|fatal error:' breakroom-giant-xcodebuild.log | tail -120 || true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BREAKROOM-GIANT-DIAGNOSTICS-${{ github.run_number }}
          path: breakroom-giant-xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop on compiler failure
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Validate bundled resources
        run: |
          set -euxo pipefail
          APP=$(find DerivedDataGiant/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP"
          find "$APP" -type f | head -80
          find "$APP" -type f -name 'longsword.obj' | grep .
          find "$APP" -type f -name 'parry.wav' | grep .
          du -sh "$APP"

      - name: Package BREAKROOM Giant IPA
        run: |
          set -euxo pipefail
          APP=$(find DerivedDataGiant/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/BreakroomGiant.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/BreakroomGiant.app/Info.plist | tee giant-bundle-id.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/BreakroomGiant.app/Info.plist | tee giant-executable.txt
          test -f "Payload/BreakroomGiant.app/$(cat giant-executable.txt)"
          ditto -c -k --sequesterRsrc --keepParent Payload BREAKROOM-GIANT-MR-v0.3-UNSIGNED.ipa
          shasum -a 256 BREAKROOM-GIANT-MR-v0.3-UNSIGNED.ipa | tee BREAKROOM-GIANT-MR-v0.3-UNSIGNED.sha256
          unzip -t BREAKROOM-GIANT-MR-v0.3-UNSIGNED.ipa
          ls -lh BREAKROOM-GIANT-MR-v0.3-UNSIGNED.ipa

      - name: Upload BREAKROOM Giant IPA
        uses: actions/upload-artifact@v4
        with:
          name: BREAKROOM-GIANT-MR-iPhone-${{ github.run_number }}
          path: |
            BREAKROOM-GIANT-MR-v0.3-UNSIGNED.ipa
            BREAKROOM-GIANT-MR-v0.3-UNSIGNED.sha256
            giant-bundle-id.txt
            giant-executable.txt
          if-no-files-found: error
          retention-days: 14
